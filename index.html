<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaka Sensi - Free Fire Sensitivity Generator</title>
  <style>
    :root {
      --bg-color: #0b0205;
      --card-bg: #16080e;
      --accent-red: #ff1e27;
      --accent-purple: #8b2cf5;
      --text-color: #ffffff;
      --text-dim: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Start Overlay for Audio Permission */
    #startOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    /* Loader Overlay */
    #loaderOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      z-index: 99;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-bar-bg {
      width: 280px;
      height: 12px;
      background: #240d17;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--accent-red);
      margin-top: 15px;
    }

    .loader-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-purple));
      transition: width 0.05s linear;
    }

    .loader-text {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-red);
      margin-top: 10px;
    }

    /* Main Container */
    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--card-bg);
      border: 2px solid var(--accent-red);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 30, 39, 0.3);
      padding: 25px;
      text-align: center;
      display: none;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid var(--accent-purple);
      box-shadow: 0 0 15px var(--accent-purple);
      object-fit: cover;
    }

    h1 {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--accent-red), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--text-color);
    }

    select {
      width: 100%;
      padding: 12px;
      background-color: #240d17;
      border: 1px solid var(--accent-red);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 8px var(--accent-purple);
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-purple));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 44, 245, 0.4);
    }

    .result-section {
      display: none;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #33121f;
    }

    .sensi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .sensi-item {
      background: #240d17;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-purple);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sensi-item span.label {
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .sensi-item span.value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-red);
    }

    .btn-copy {
      background-color: transparent;
      border: 1px solid var(--accent-purple);
      color: var(--accent-purple);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background-color: var(--accent-purple);
      color: #fff;
    }

    footer {
      margin-top: 30px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="sensiAudio" src="https://files.catbox.moe/mkojpz.wav" preload="auto"></audio>

  <!-- Initial User Tap Overlay to satisfy browser autoplay policies -->
  <div id="startOverlay">
    <div class="logo-container">
      <img src="Gemini_Generated_Image_z49spdz49spdz49s.jpg" alt="Zaka Sensi Logo">
    </div>
    <h1>Zaka Sensi</h1>
    <button class="btn-action" style="max-width: 250px;" onclick="startApp()">Enter Site</button>
  </div>

  <!-- Loading Screen Overlay -->
  <div id="loaderOverlay">
    <div class="logo-container">
      <img src="Gemini_Generated_Image_z49spdz49spdz49s.jpg" alt="Zaka Sensi Logo">
    </div>
    <div class="loader-text" id="loaderText">0%</div>
    <div class="loader-bar-bg">
      <div class="loader-bar-fill" id="loaderFill"></div>
    </div>
  </div>

  <!-- Main Website Container -->
  <div class="container" id="mainContainer">
    <div class="logo-container">
      <img src="Gemini_Generated_Image_z49spdz49spdz49s.jpg" alt="Zaka Sensi Logo">
    </div>

    <h1>Zaka Sensi</h1>
    <p class="subtitle">Best Free Fire Headshot Sensitivity Generator (100 - 200 Range)</p>

    <div class="form-group">
      <label for="device">Select Device Brand:</label>
      <select id="device">
        <option value="samsung">Samsung</option>
        <option value="xiaomi">Xiaomi / Redmi / POCO</option>
        <option value="realme">Realme</option>
        <option value="iphone">iPhone / iPad</option>
        <option value="infinix">Infinix / Tecno</option>
        <option value="other">Other Device</option>
      </select>
    </div>

    <div class="form-group">
      <label for="ram">Select Device RAM:</label>
      <select id="ram">
        <option value="2-3">2GB - 3GB RAM</option>
        <option value="4-6">4GB - 6GB RAM</option>
        <option value="8+">8GB+ RAM</option>
      </select>
    </div>

    <button class="btn-action" onclick="generateSensi()">Generate Best Sensi</button>

    <div class="result-section" id="resultSection">
      <div class="sensi-grid">
        <div class="sensi-item">
          <span class="label">General:</span>
          <span class="value" id="valGeneral">190</span>
        </div>
        <div class="sensi-item">
          <span class="label">Red Dot:</span>
          <span class="value" id="valRedDot">185</span>
        </div>
        <div class="sensi-item">
          <span class="label">2x Scope:</span>
          <span class="value" id="val2x">175</span>
        </div>
        <div class="sensi-item">
          <span class="label">4x Scope:</span>
          <span class="value" id="val4x">165</span>
        </div>
        <div class="sensi-item">
          <span class="label">Sniper Scope:</span>
          <span class="value" id="valSniper">140</span>
        </div>
        <div class="sensi-item">
          <span class="label">Free Look:</span>
          <span class="value" id="valFreeLook">150</span>
        </div>
      </div>

      <div class="sensi-item" style="margin-bottom: 20px; border-left-color: var(--accent-red);">
        <span class="label">Fire Button Size:</span>
        <span class="value" id="valFireButton">45%</span>
      </div>

      <button class="btn-copy" onclick="copySettings()">Copy Settings</button>
    </div>

    <footer>
      &copy; 2026 Zaka Sensi. All rights reserved.
    </footer>
  </div>

  <script>
    const audio = document.getElementById('sensiAudio');
    let soundPlayed = false;

    function startApp() {
      document.getElementById('startOverlay').style.display = 'none';
      document.getElementById('loaderOverlay').style.display = 'flex';
      
      // Initialize audio context via user interaction
      audio.load();

      let progress = 0;
      const fill = document.getElementById('loaderFill');
      const text = document.getElementById('loaderText');

      const interval = setInterval(() => {
        progress += 1;
        fill.style.width = progress + '%';
        text.innerText = progress + '%';

        // Play sound when progress reaches 90%
        if (progress >= 90 && !soundPlayed) {
          soundPlayed = true;
          audio.play().catch(e => console.log('Audio autoplay prevented:', e));
        }

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            document.getElementById('loaderOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
          }, 300);
        }
      }, 30);
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSensi() {
      const ram = document.getElementById('ram').value;

      let general, redDot, scope2, scope4, sniper, freeLook, fireButton;

      // Sensitivity values strictly kept between 100 and 200
      if (ram === '2-3') {
        general = getRandomInt(185, 200);
        redDot = getRandomInt(180, 198);
        scope2 = getRandomInt(175, 195);
        scope4 = getRandomInt(170, 190);
        fireButton = getRandomInt(40, 48);
      } else if (ram === '4-6') {
        general = getRandomInt(160, 185);
        redDot = getRandomInt(155, 180);
        scope2 = getRandomInt(150, 175);
        scope4 = getRandomInt(145, 170);
        fireButton = getRandomInt(45, 52);
      } else {
        general = getRandomInt(130, 160);
        redDot = getRandomInt(125, 155);
        scope2 = getRandomInt(120, 150);
        scope4 = getRandomInt(115, 145);
        fireButton = getRandomInt(50, 58);
      }

      sniper = getRandomInt(100, 140);
      freeLook = getRandomInt(120, 170);

      document.getElementById('valGeneral').innerText = general;
      document.getElementById('valRedDot').innerText = redDot;
      document.getElementById('val2x').innerText = scope2;
      document.getElementById('val4x').innerText = scope4;
      document.getElementById('valSniper').innerText = sniper;
      document.getElementById('valFreeLook').innerText = freeLook;
      document.getElementById('valFireButton').innerText = fireButton + '%';

      document.getElementById('resultSection').style.display = 'block';
    }

    function copySettings() {
      const g = document.getElementById('valGeneral').innerText;
      const rd = document.getElementById('valRedDot').innerText;
      const s2 = document.getElementById('val2x').innerText;
      const s4 = document.getElementById('val4x').innerText;
      const sn = document.getElementById('valSniper').innerText;
      const fl = document.getElementById('valFreeLook').innerText;
      const fb = document.getElementById('valFireButton').innerText;

      const textToCopy = `Zaka Sensi Settings:\nGeneral: ${g}\nRed Dot: ${rd}\n2x Scope: ${s2}\n4x Scope: ${s4}\nSniper Scope: ${sn}\nFree Look: ${fl}\nFire Button: ${fb}`;

      navigator.clipboard.writeText(textToCopy).then(() => {
        alert('Sensitivity settings copied to clipboard!');
      });
    }
  </script>
</body>
</html>
