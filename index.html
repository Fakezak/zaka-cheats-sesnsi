<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaka Sensi - Free Fire Sensitivity Generator</title>
  <style>
    :root {
      --bg-color: #0b0205;
      --card-bg: #16080e;
      --accent-red: #ff1e27;
      --accent-purple: #8b2cf5;
      --text-color: #ffffff;
      --text-dim: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background-color: var(--card-bg);
      border: 2px solid var(--accent-red);
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 30, 39, 0.3);
      padding: 25px;
      text-align: center;
      margin-top: 20px;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-container img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid var(--accent-purple);
      box-shadow: 0 0 15px var(--accent-purple);
      object-fit: cover;
    }

    h1 {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--accent-red), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--text-color);
    }

    select {
      width: 100%;
      padding: 12px;
      background-color: #240d17;
      border: 1px solid var(--accent-red);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 8px var(--accent-purple);
    }

    .btn-generate {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-purple));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(139, 44, 245, 0.4);
    }

    .result-section {
      display: none;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #33121f;
    }

    .sensi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .sensi-item {
      background: #240d17;
      padding: 12px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-purple);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sensi-item span.label {
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .sensi-item span.value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-red);
    }

    .btn-copy {
      background-color: transparent;
      border: 1px solid var(--accent-purple);
      color: var(--accent-purple);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background-color: var(--accent-purple);
      color: #fff;
    }

    footer {
      margin-top: 30px;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Logo Section -->
    <div class="logo-container">
      <img src="Gemini_Generated_Image_z49spdz49spdz49s.jpg" alt="Zaka Sensi Logo">
    </div>

    <h1>Zaka Sensi</h1>
    <p class="subtitle">Best Free Fire Headshot Sensitivity Generator</p>

    <!-- Inputs -->
    <div class="form-group">
      <label for="device">Select Device Brand:</label>
      <select id="device">
        <option value="samsung">Samsung</option>
        <option value="xiaomi">Xiaomi / Redmi / POCO</option>
        <option value="realme">Realme</option>
        <option value="iphone">iPhone / iPad</option>
        <option value="infinix">Infinix / Tecno</option>
        <option value="other">Other Android</option>
      </select>
    </div>

    <div class="form-group">
      <label for="ram">Select Device RAM:</label>
      <select id="ram">
        <option value="2-3">2GB - 3GB RAM</option>
        <option value="4-6">4GB - 6GB RAM</option>
        <option value="8+">8GB+ RAM</option>
      </select>
    </div>

    <button class="btn-generate" onclick="generateSensi()">Generate Best Sensi</button>

    <!-- Output -->
    <div class="result-section" id="resultSection">
      <div class="sensi-grid">
        <div class="sensi-item">
          <span class="label">General:</span>
          <span class="value" id="valGeneral">95</span>
        </div>
        <div class="sensi-item">
          <span class="label">Red Dot:</span>
          <span class="value" id="valRedDot">90</span>
        </div>
        <div class="sensi-item">
          <span class="label">2x Scope:</span>
          <span class="value" id="val2x">85</span>
        </div>
        <div class="sensi-item">
          <span class="label">4x Scope:</span>
          <span class="value" id="val4x">80</span>
        </div>
        <div class="sensi-item">
          <span class="label">Sniper Scope:</span>
          <span class="value" id="valSniper">50</span>
        </div>
        <div class="sensi-item">
          <span class="label">Free Look:</span>
          <span class="value" id="valFreeLook">65</span>
        </div>
      </div>

      <div class="sensi-item" style="margin-bottom: 20px; border-left-color: var(--accent-red);">
        <span class="label">Fire Button Size:</span>
        <span class="value" id="valFireButton">45%</span>
      </div>

      <button class="btn-copy" onclick="copySettings()">Copy Settings</button>
    </div>
  </div>

  <footer>
    &copy; 2026 Zaka Sensi. All rights reserved.
  </footer>

  <script>
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSensi() {
      const ram = document.getElementById('ram').value;

      let general, redDot, scope2, scope4, sniper, freeLook, fireButton;

      if (ram === '2-3') {
        general = getRandomInt(96, 100);
        redDot = getRandomInt(92, 98);
        scope2 = getRandomInt(88, 95);
        scope4 = getRandomInt(85, 92);
        fireButton = getRandomInt(40, 48);
      } else if (ram === '4-6') {
        general = getRandomInt(90, 96);
        redDot = getRandomInt(85, 92);
        scope2 = getRandomInt(82, 90);
        scope4 = getRandomInt(80, 88);
        fireButton = getRandomInt(45, 52);
      } else {
        general = getRandomInt(85, 92);
        redDot = getRandomInt(80, 88);
        scope2 = getRandomInt(78, 85);
        scope4 = getRandomInt(75, 82);
        fireButton = getRandomInt(50, 58);
      }

      sniper = getRandomInt(45, 60);
      freeLook = getRandomInt(50, 75);

      document.getElementById('valGeneral').innerText = general;
      document.getElementById('valRedDot').innerText = redDot;
      document.getElementById('val2x').innerText = scope2;
      document.getElementById('val4x').innerText = scope4;
      document.getElementById('valSniper').innerText = sniper;
      document.getElementById('valFreeLook').innerText = freeLook;
      document.getElementById('valFireButton').innerText = fireButton + '%';

      document.getElementById('resultSection').style.display = 'block';
    }

    function copySettings() {
      const g = document.getElementById('valGeneral').innerText;
      const rd = document.getElementById('valRedDot').innerText;
      const s2 = document.getElementById('val2x').innerText;
      const s4 = document.getElementById('val4x').innerText;
      const sn = document.getElementById('valSniper').innerText;
      const fl = document.getElementById('valFreeLook').innerText;
      const fb = document.getElementById('valFireButton').innerText;

      const textToCopy = `Zaka Sensi Settings:\nGeneral: ${g}\nRed Dot: ${rd}\n2x Scope: ${s2}\n4x Scope: ${s4}\nSniper Scope: ${sn}\nFree Look: ${fl}\nFire Button: ${fb}`;

      navigator.clipboard.writeText(textToCopy).then(() => {
        alert('Sensitivity settings copied to clipboard!');
      });
    }
  </script>
</body>
</html>
